<div class="app" [class.app--collapsed]="collapsed() && !isLoginRoute()" [class.app--login]="isLoginRoute()">
  <aside class="app-sidenav">
    <div class="app-sidenav__brand">
      <i class="pi pi-heart app-sidenav__logo"></i>
      <span class="app-sidenav__name">{{ panelName() }}</span>
    </div>

    <p-panelmenu class="app-sidenav__menu" [model]="navItems()" />

    <button
      type="button"
      class="app-sidenav__logout"
      aria-label="Cerrar sesión"
      (click)="logout()"
    >
      <i class="pi pi-sign-out"></i>
      <span class="app-sidenav__logout-label">Cerrar sesión</span>
    </button>

    <button
      type="button"
      class="app-sidenav__toggle"
      aria-label="Colapsar o expandir menú"
      [attr.aria-expanded]="collapsed() ? 'false' : 'true'"
      (click)="toggleSidebar()"
    >
      <i [class]="collapsed() ? 'pi pi-angle-right' : 'pi pi-angle-left'"></i>
    </button>
  </aside>

  <main class="app-main">
    <router-outlet />
  </main>
</div>

@if (sessionTimeout.warningVisible()) {
  <div class="session-timeout-modal" role="dialog" aria-modal="true" aria-labelledby="session-timeout-title">
    <div class="session-timeout-modal__card">
      <div class="session-timeout-modal__icon"><i class="pi pi-clock" aria-hidden="true"></i></div>
      <h2 id="session-timeout-title" class="session-timeout-modal__title">Tu sesión está por expirar</h2>
      <p class="session-timeout-modal__message">
        Llevas un tiempo sin actividad. Tu sesión cerrará en menos de un minuto.
        Pulsa “Seguir conectado” para continuar trabajando.
      </p>
      <button type="button" class="session-timeout-modal__button" (click)="sessionTimeout.keepAlive()">
        <i class="pi pi-user" aria-hidden="true"></i>
        Seguir conectado
      </button>
    </div>
  </div>
}
